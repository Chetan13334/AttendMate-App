<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>AttendMate</title>
  <base href="/" />

  <!-- Critical for notch to work properly -->

  <!-- These two lines are REQUIRED for full control of notch color -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta name="color-scheme" content="light dark" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="shortcut icon" type="image/png" href="/src/assets/MainLogoBG.png" />
  <link rel="shortcut icon" type="image/png" href="/favicon.png" />

  <!-- Optional: force white background on startup -->
  <style>
    body,
    #root,
    .ion-page,
    ion-app {
      background-color: #ffffff !important;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
